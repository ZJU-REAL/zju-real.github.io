<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Animated: an ink path heads up and to the right, a node pulses, and the path is nudged onto a new course while its original course fades to a dashed line">
  <style>
    .seg1 { stroke-dasharray: 210; stroke-dashoffset: 210; animation: draw1 7s cubic-bezier(.4,.1,.3,1) infinite; }
    .ghost { opacity: 0; animation: ghost 7s ease infinite; }
    .seg2 { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw2 7s cubic-bezier(.4,.1,.3,1) infinite; }
    .d0 { opacity: 0; animation: pop0 7s ease infinite; }
    .d1 { opacity: 0; animation: pop1 7s ease infinite; }
    .d2 { opacity: 0; animation: pop2 7s ease infinite; }
    .ring { opacity: 0; animation: ring 7s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes draw1 { 0% { stroke-dashoffset: 210; } 18%, 88% { stroke-dashoffset: 0; } 96%, 100% { stroke-dashoffset: 210; } }
    @keyframes ghost { 0%, 18% { opacity: 0; } 28% { opacity: .5; } 40%, 86% { opacity: .38; } 96%, 100% { opacity: 0; } }
    @keyframes draw2 { 0%, 40% { stroke-dashoffset: 200; } 58%, 88% { stroke-dashoffset: 0; } 96%, 100% { stroke-dashoffset: 200; } }
    @keyframes pop0 { 0% { opacity: 0; } 6%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes pop1 { 0%, 16% { opacity: 0; } 22%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes pop2 { 0%, 56% { opacity: 0; } 62%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes ring { 0%, 30% { opacity: 0; transform: scale(.6); } 34% { opacity: .55; transform: scale(1); } 46% { opacity: 0; transform: scale(2.2); } 100% { opacity: 0; transform: scale(2.2); } }
    @media (prefers-reduced-motion: reduce) {
      .seg1, .seg2 { animation: none; stroke-dashoffset: 0; }
      .ghost { animation: none; opacity: .38; }
      .d0, .d1, .d2 { animation: none; opacity: 1; }
      .ring { animation: none; opacity: 0; }
    }
  </style>
  <defs>
    <filter id="torn" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="1" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g class="paper">
    <path filter="url(#torn)" fill="#c3d5cb" d="M290 222 L441 42 A235 235 0 0 1 499 329 Z"/>
  </g>
  <g class="ghost">
    <path d="M290 222 L456 96" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 15"/>
    <circle cx="462" cy="91" r="9" fill="none" stroke="#141414" stroke-width="4"/>
  </g>
  <g filter="url(#ink)" fill="none" stroke="#141414" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path class="seg1" d="M118 334 L290 222"/>
    <path class="seg2" d="M290 222 L484 270"/>
  </g>
  <circle class="ring" cx="290" cy="222" r="26" fill="none" stroke="#141414" stroke-width="3"/>
  <g fill="#141414">
    <circle class="d0" cx="118" cy="334" r="15"/>
    <circle class="d1" cx="290" cy="222" r="20"/>
    <circle class="d2" cx="484" cy="270" r="15"/>
  </g>
</svg>
