<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Animated: a torn paper fan stands for the space of knowledge a question opens up; thick ink rays of different lengths grow out of one root dot across it, some short and some long, with dots along them, while faint dashed rays mark directions left uncovered">
  <style>
    .f { opacity: 0; animation: f 10s ease infinite; }
    @keyframes f { 0%, 4% { opacity: 0; } 12%, 90% { opacity: .4; } 97%, 100% { opacity: 0; } }
    .r0 { opacity: 0; animation: r0 10s ease infinite; }
    @keyframes r0 { 0% { opacity: 0; } 4%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .s0 { stroke-dasharray: 149; stroke-dashoffset: 149; animation: s0 10s cubic-bezier(.4,.1,.3,1) infinite; }
    @keyframes s0 { 0%, 14% { stroke-dashoffset: 149; } 22%, 90% { stroke-dashoffset: 0; } 97%, 100% { stroke-dashoffset: 149; } }
    .d00 { opacity: 0; animation: d00 10s ease infinite; }
    @keyframes d00 { 0%, 21.0% { opacity: 0; } 23.5%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .s1 { stroke-dasharray: 221; stroke-dashoffset: 221; animation: s1 10s cubic-bezier(.4,.1,.3,1) infinite; }
    @keyframes s1 { 0%, 24% { stroke-dashoffset: 221; } 36%, 90% { stroke-dashoffset: 0; } 97%, 100% { stroke-dashoffset: 221; } }
    .d10 { opacity: 0; animation: d10 10s ease infinite; }
    @keyframes d10 { 0%, 29.0% { opacity: 0; } 31.5%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .d11 { opacity: 0; animation: d11 10s ease infinite; }
    @keyframes d11 { 0%, 35.0% { opacity: 0; } 37.5%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .s2 { stroke-dasharray: 258; stroke-dashoffset: 258; animation: s2 10s cubic-bezier(.4,.1,.3,1) infinite; }
    @keyframes s2 { 0%, 34% { stroke-dashoffset: 258; } 50%, 90% { stroke-dashoffset: 0; } 97%, 100% { stroke-dashoffset: 258; } }
    .d20 { opacity: 0; animation: d20 10s ease infinite; }
    @keyframes d20 { 0%, 38.3% { opacity: 0; } 40.8%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .d21 { opacity: 0; animation: d21 10s ease infinite; }
    @keyframes d21 { 0%, 43.6% { opacity: 0; } 46.1%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .d22 { opacity: 0; animation: d22 10s ease infinite; }
    @keyframes d22 { 0%, 49.0% { opacity: 0; } 51.5%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .s3 { stroke-dasharray: 188; stroke-dashoffset: 188; animation: s3 10s cubic-bezier(.4,.1,.3,1) infinite; }
    @keyframes s3 { 0%, 50% { stroke-dashoffset: 188; } 60%, 90% { stroke-dashoffset: 0; } 97%, 100% { stroke-dashoffset: 188; } }
    .d30 { opacity: 0; animation: d30 10s ease infinite; }
    @keyframes d30 { 0%, 54.0% { opacity: 0; } 56.5%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .d31 { opacity: 0; animation: d31 10s ease infinite; }
    @keyframes d31 { 0%, 59.0% { opacity: 0; } 61.5%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .s4 { stroke-dasharray: 151; stroke-dashoffset: 151; animation: s4 10s cubic-bezier(.4,.1,.3,1) infinite; }
    @keyframes s4 { 0%, 60% { stroke-dashoffset: 151; } 67%, 90% { stroke-dashoffset: 0; } 97%, 100% { stroke-dashoffset: 151; } }
    .d40 { opacity: 0; animation: d40 10s ease infinite; }
    @keyframes d40 { 0%, 66.0% { opacity: 0; } 68.5%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      [class^="s"] { animation: none; stroke-dashoffset: 0; }
      .f { animation: none; opacity: .4; }
      [class^="d"], .r0 { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <filter id="torn" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="1" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g transform="translate(0 22)">
  <path filter="url(#torn)" fill="#cbd8d3" d="M38 330 A262 262 0 0 1 562 330 Z"/>
  <path filter="url(#torn)" fill="#bccbc5" d="M300 330 L118 142 A262 262 0 0 1 300 68 Z" opacity=".55"/>
  <g class="f" fill="none" stroke="#141414" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round">
    <path d="M300 330 L70 246"/>
    <path d="M300 330 L185 114"/>
    <path d="M300 330 L363 93"/>
    <path d="M300 330 L488 172"/>
    <path d="M300 330 L537 267"/>
  </g>
  <g filter="url(#ink)" fill="none" stroke="#141414" stroke-width="12" stroke-linecap="round">
    <path class="s0" d="M300 330 L170 262"/>
    <path class="s1" d="M300 330 L176 150"/>
    <path class="s2" d="M300 330 L300 74"/>
    <path class="s3" d="M300 330 L410 180"/>
    <path class="s4" d="M300 330 L446 298"/>
  </g>
  <g fill="#141414">
    <circle class="d00" cx="170" cy="262" r="13"/>
    <circle class="d10" cx="238" cy="240" r="11"/>
    <circle class="d11" cx="176" cy="150" r="14"/>
    <circle class="d20" cx="300" cy="245" r="11"/>
    <circle class="d21" cx="300" cy="160" r="12"/>
    <circle class="d22" cx="300" cy="74" r="15"/>
    <circle class="d30" cx="355" cy="255" r="11"/>
    <circle class="d31" cx="410" cy="180" r="13"/>
    <circle class="d40" cx="446" cy="298" r="12"/>
    <circle class="r0" cx="300" cy="330" r="20"/>
  </g>
  </g>
</svg>
